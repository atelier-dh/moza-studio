name: Build and deploy Moza Studio + FigCraft

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Moza Studio and FigCraft source
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            figcraft-source -> figcraft-source/target

      - name: Install wasm-opt and Trunk
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen
          cargo install trunk --locked

      - name: Build FigCraft WebAssembly application
        working-directory: figcraft-source/apps/figcraft-web
        run: trunk build --release

      - name: Assemble same-origin static website
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/moza-site"
          FIGCRAFT_DIST="figcraft-source/dist/web"
          test -f "$FIGCRAFT_DIST/index.html"
          compgen -G "$FIGCRAFT_DIST/*.wasm" >/dev/null

          rm -rf "$SITE"
          mkdir -p "$SITE/figcraft"

          # Copy Moza's existing static site without copying its build source or workflow.
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/figcraft-source/' \
            --exclude='/dist/' \
            --exclude='/_site/' \
            ./ "$SITE/"

          # Trunk's public_url is ./, so hashed JS/WASM assets remain relative and work
          # below /figcraft/ as well as on a GitHub Pages project-site path.
          cp -a "$FIGCRAFT_DIST/." "$SITE/figcraft/"
          cp figcraft-source/packaging/web/_headers "$SITE/figcraft/_headers"
          cp figcraft-source/packaging/web/.htaccess "$SITE/figcraft/.htaccess"
          cp figcraft-source/packaging/web/README.md "$SITE/figcraft/HOSTING.md"
          touch "$SITE/.nojekyll"

          echo "Static site assembled at $SITE"
          find "$SITE/figcraft" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/moza-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
